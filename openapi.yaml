          minLength: 1
        description: |-
          * `legacy` - legacy
          * `disaggregated` - disaggregated
          * `tff` - tff
      - in: query
        name: resolution_status
        schema:
          type: string
          maxLength: 20
          minLength: 1
      - in: query
        name: severity
        schema:
          enum:
          - INFO
          - WARNING
          - ERROR
          - CRITICAL
          type: string
          minLength: 1
        description: |-
          * `INFO` - INFO
          * `WARNING` - WARNING
          * `ERROR` - ERROR
          * `CRITICAL` - CRITICAL
