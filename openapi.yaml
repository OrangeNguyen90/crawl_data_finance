        name: source
        schema:
          type: string
          maxLength: 40
          minLength: 1
      - in: query
        name: start
        schema:
          type: string
          format: date
      - in: query
        name: status
        schema:
          type: string
          maxLength: 30
          minLength: 1
      - in: query
        name: symbol
        schema:
          type: string
          maxLength: 100
          minLength: 1
      - in: query
        name: timeframe
        schema:
          type: string
          maxLength: 20
          minLength: 1
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobList'
          description: ''
