components:
  schemas:
    ActionEnum:
      enum:
      - enable
      - disable
      - sync
      - backfill
      - cancel
      type: string
      description: |-
        * `enable` - enable
        * `disable` - disable
        * `sync` - sync
        * `backfill` - backfill
        * `cancel` - cancel
    ActionQuery:
      type: object
      properties:
        source:
          type: string
          maxLength: 40
        action:
          $ref: '#/components/schemas/ActionEnum'
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        report_type:
          $ref: '#/components/schemas/ReportTypeEnum'
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        market_code:
          type: string
          maxLength: 40
      required:
      - action
      - source
    Cot:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        report_date:
          type: string
          format: date
        publication_date:
          type: string
          format: date
          nullable: true
        market_code:
          type: string
          maxLength: 40
        market_name:
          type: string
          maxLength: 255
        report_type:
          type: string
          maxLength: 40
        futures_options_scope:
          type: string
          maxLength: 40
        open_interest:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        trader_positions: {}
        raw_fields: {}
        updated_at:
          type: string
          format: date-time
          readOnly: true
        source:
          type: integer
        source_file:
          type: integer
      required:
      - futures_options_scope
