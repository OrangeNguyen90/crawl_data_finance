          type: string
          maxLength: 30
          minLength: 1
      - in: query
        name: report_status
        schema:
          enum:
          - preliminary
          - final
          - unspecified
          type: string
          minLength: 1
        description: |-
          * `preliminary` - preliminary
          * `final` - final
          * `unspecified` - unspecified
      - in: query
